# Sports Analytics Intelligence System Configuration

# Video Processing
video:
  input_path: "input_videos/08fd33_4.mp4"
  output_path: "output_videos/output_video.mp4"
  fps: 24
  codec: "mp4v"

# Model Configuration
models:
  detection_model: "models/best.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45

# Tracking Configuration
tracking:
  use_stub: true
  stub_path: "stubs/track_stubs.pkl"
  max_disappeared_frames: 50
  interpolate_ball: true

# Camera Movement
camera:
  use_stub: true
  stub_path: "stubs/camera_movement_stub.pkl"
  feature_params:
    maxCorners: 100
    qualityLevel: 0.3
    minDistance: 3
    blockSize: 7

# Team Assignment
team_assignment:
  kmeans_clusters: 2
  max_iterations: 100

# Speed and Distance
speed_distance:
  fps: 24
  meters_per_pixel: 0.1
  window_size: 5

# Analytics Features
analytics:
  generate_heatmaps: true
  track_formations: true
  analyze_passes: true
  export_statistics: true
  
# Heatmap Settings
heatmap:
  grid_size: 20
  alpha: 0.6
  colormap: "hot"

# Formation Detection
formation:
  min_players: 7
  clustering_method: "kmeans"
  update_interval: 30  # frames

# Pass Detection
pass_detection:
  max_pass_distance: 50  # meters
  min_ball_speed: 2.0  # m/s
  max_time_between_touches: 3.0  # seconds

# Export Settings
export:
  format: ["json", "csv"]
  include_raw_data: false
  export_path: "analytics_output/"

# Visualization
visualization:
  show_annotations: true
  show_speed: true
  show_team_colors: true
  show_ball_possession: true
  show_player_ids: true
  annotation_font_scale: 0.6
  line_thickness: 2

# Logging
logging:
  level: "INFO"
  log_file: "logs/sports_analytics.log"
  console_output: true
